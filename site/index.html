<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOC Past Quizzes</title>
<meta name="description" content="Every past weekly quiz of NPTEL's The Joy of Computing using Python (2018–2026), answerable in place with instant feedback.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{const t=localStorage.getItem("joc:theme");if(t)document.documentElement.dataset.theme=t;const z=localStorage.getItem("joc:size");if(z)document.documentElement.style.setProperty("--fs",z+"px")}catch(e){}</script>
</head>
<body>
<a class="skip" href="#main">Skip to questions</a>
<header class="top">
  <button class="icon-btn menu" id="menu" aria-label="Choose week" aria-expanded="false" aria-controls="toc">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="#w0" aria-label="Joy of Computing past quizzes">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path class="mk-b" d="M15.6 3c-6.3 0-5.9 2.7-5.9 2.7v2.8h6v.9H7.4S3 8.9 3 15.3s3.9 6.2 3.9 6.2h2.3v-3s-.1-3.9 3.8-3.9h6.5s3.7.1 3.7-3.6V5.9S23.8 3 15.6 3Zm-3.6 2a1.1 1.1 0 1 1 0 2.2A1.1 1.1 0 0 1 12 5Z"/><path class="mk-y" d="M16.4 29c6.3 0 5.9-2.7 5.9-2.7v-2.8h-6v-.9h8.3s4.4.5 4.4-5.9-3.9-6.2-3.9-6.2h-2.3v3s.1 3.9-3.8 3.9h-6.5s-3.7-.1-3.7 3.6v5.1S8.2 29 16.4 29Zm3.6-2a1.1 1.1 0 1 1 0-2.2 1.1 1.1 0 0 1 0 2.2Z"/></svg>
    <span><b>Joy of Computing</b> <span class="brand-sub">past quizzes</span></span>
  </a>
  <label class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
    <input id="q" type="search" placeholder="Search all weeks" autocomplete="off" aria-label="Search all questions">
  </label>
  <div class="tools">
    <button class="icon-btn" id="smaller" aria-label="Smaller text"><span class="aa">A</span><sub>−</sub></button>
    <button class="icon-btn" id="larger" aria-label="Larger text"><span class="aa big">A</span><sub>+</sub></button>
    <button class="icon-btn" id="theme" aria-label="Toggle dark mode">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
    </button>
  </div>
</header>

<div class="layout">
  <nav class="toc" id="toc" aria-label="Weeks">
    <p class="toc-title">Weeks</p>
    <ol id="weeks"></ol>
    <div class="toc-foot">
      <button class="link-btn" id="export">Export progress</button>
      <label class="link-btn">Import progress<input type="file" id="import" accept="application/json" hidden></label>
    </div>
  </nav>

  <main id="main" tabindex="-1">
    <div class="week-head">
      <h1 id="title">Loading…</h1>
      <p class="week-desc" id="week-desc"></p>
      <p class="summary" id="summary"></p>
      <div class="progress" aria-hidden="true"><span id="bar-ok"></span><span id="bar-bad"></span></div>
    </div>
    <div class="filters" role="group" aria-label="Filters">
      <div class="chips" id="years" role="group" aria-label="Sessions"></div>
      <div class="filter-row">
        <div class="seg" id="status" role="group" aria-label="Show">
          <button type="button" data-f="all">All</button>
          <button type="button" data-f="todo">Unanswered</button>
          <button type="button" data-f="wrong">Wrong</button>
          <button type="button" data-f="saved">Saved</button>
        </div>
        <label class="sort">Order
          <select id="sort">
            <option value="rep">Most repeated first</option>
            <option value="new">Newest session first</option>
            <option value="old">Oldest session first</option>
          </select>
        </label>
      </div>
    </div>
    <p class="hint">Keys: <kbd>J</kbd>/<kbd>K</kbd> next/previous, <kbd>1</kbd>–<kbd>8</kbd> pick, <kbd>Enter</kbd> submit.</p>
    <div id="list"></div>
    <p class="empty" id="empty" hidden></p>
  </main>
</div>

<dialog id="zoom" aria-label="Image">
  <form method="dialog"><button class="icon-btn close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></form>
  <div id="zoom-body"></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
